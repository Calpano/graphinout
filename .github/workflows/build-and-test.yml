name: Build and Test

on:
  push:
  workflow_dispatch:

# list of OSes and what they contain https://github.com/actions/virtual-environments

jobs:
  # This steps uses the maven cache better
  The-Build:
    runs-on: ubuntu-latest
    # Grant permissions for GITHUB_TOKEN to upload packages
    permissions:
      contents: read
      packages: write
    env:
      MAVEN_OPTS: "-Xmx6144m"
      # The `secrets` context is NOT available in a step-level `if:` - a workflow using it is rejected
      # outright ("workflow file issue") and NO job runs, so the build reports failure having executed
      # nothing. Secrets may be read in `env:`, so the presence test is materialised here as a string
      # ("true"/"false") and the steps below branch on that instead.
      HAS_MAVEN_CENTRAL: ${{ secrets.MAVEN_CENTRAL_USER != '' }}
    steps:
      - name: ↙️ Check out repository code from git
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: graphinout

      - name: ↙️ Check out external graph-test-data (sibling of graphinout)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Calpano/graph-test-data
          ref: 546f3bf2058d3e2469326a0f83f8f0d3b1de1855 # pin for reproducible CI; bump when data changes
          path: graph-test-data

      - name: ☕ Setup Java JDK and Authenticate with GitHub Packages
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21' # Mockito 5.20 also builds clean on JDK 26 (verified); 21 kept as the CI baseline
          cache: 'maven'
          server-id: github-graphinout # This ID must match the <id> in your pom.xml's <distributionManagement>

      - name: "⚙️ Configure settings.xml for Maven (without Central)"
        if: env.HAS_MAVEN_CENTRAL == 'false'
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          override: true
          githubServer: false
          servers: |
            [{
                "id": "github-graphinout",
                "username": "${{ env.GITHUB_ACTOR }}",
                "password": "${{ env.GITHUB_TOKEN }}"
            }]

      - name: "⚙️ Configure settings.xml for Maven (with Central)"
        if: env.HAS_MAVEN_CENTRAL == 'true'
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          MAVEN_CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USER }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        with:
          override: true
          githubServer: false
          servers: |
            [{
                "id": "github-graphinout",
                "username": "${{ env.GITHUB_ACTOR }}",
                "password": "${{ env.GITHUB_TOKEN }}"
            },{
                "id": "central",
                "username": "${{ env.MAVEN_CENTRAL_USER }}",
                "password": "${{ env.MAVEN_CENTRAL_TOKEN }}"
            }]

      # --- This single step replaces the previous four ---
      - name: 🔨 Build, Test, and Package all modules
        working-directory: graphinout
        env:
          # Surefire forks inherit env vars (but not -D system properties); TestFileUtil reads this.
          GRAPH_TEST_DATA_DIR: ${{ github.workspace }}/graph-test-data
        run: mvn clean install --batch-mode

      #      - name: ⬇️ Install root project
      #        working-directory: graphinout
      #        run: mvn clean -N install
      #
      #      - name: 🔨️ Build & ⬇ install base
      #        working-directory: graphinout/base
      #        run: mvn clean install
      #
      #      - name: 🔨️ Build & ⬇ install readers
      #        working-directory: graphinout
      #        run: mvn clean -pl !base,!engine install
      #
      #      - name: 🔨️ Build & ⬇ install engine
      #        working-directory: graphinout
      #        run: mvn clean -pl engine install

      - name: ↗️ Deploy to Github Package Registry
        # TODO enable when deploy works
        # if: github.ref == 'refs/heads/main'
        working-directory: graphinout
        run: mvn deploy --batch-mode -DskipTests
